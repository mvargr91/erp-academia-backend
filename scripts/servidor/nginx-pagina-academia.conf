# Bloque del frontend en /etc/nginx/sites-available/erp (server_name zunevia.digital *.zunevia.digital).
# Reemplaza el `location / { try_files $uri /index.html; }` por estos dos bloques: los archivos del
# frontend (JS, CSS, imágenes) siguen saliendo directo de /var/www/erp-frontend y la página (cualquier
# ruta que no sea un archivo) la entrega el ERP con el nombre, texto, logo e ícono de la academia del
# subdominio, para que la vista previa al compartir el enlace muestre su marca (PaginaAcademiaController).

    location / {
        try_files $uri @pagina;
    }

    location @pagina {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/erp-academia-backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /pagina-academia;
        fastcgi_param QUERY_STRING "";
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param HTTPS on;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_PAGINA_URL $scheme://$host$request_uri;
    }
